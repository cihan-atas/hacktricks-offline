name: Build HackTricks Vault APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  schedule:
    # Her ayın 1'inde ve 15'inde gece 00:00'da otomatik çalışıp yeni güncellemeleri çeker
    - cron: '0 0 1,15 * *'

jobs:
  build:
    name: Build & Package Flutter APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.2'
          channel: 'stable'
          cache: true

      - name: Fetch and Build HackTricks Content (EN & TR)
        run: |
          chmod +x ./scripts/fetch_and_build.sh
          ./scripts/fetch_and_build.sh || true
          python3 ./scripts/build_hacktricks_content.py
          python3 ./scripts/extract_hacktricks_commands.py

      - name: Build Flutter APK
        run: |
          cd app
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Rename APK
        run: |
          DATE=$(date +'%Y-%m-%d')
          mv app/build/app/outputs/flutter-apk/app-release.apk HackTricks-Vault-${DATE}.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HackTricks-Vault-APK
          path: HackTricks-Vault-*.apk
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: HackTricks Vault v2.0.${{ github.run_number }} (AI & TTS)
          body: |
            Yeni Nesil HackTricks Vault Android Uygulaması!
            - ⚡ Arsenal: Canlı Parametreli Pentest Komut Oluşturucu (590+ Komut, 6 Kategori)
            - 🎨 Modern Cyber Dark Mobil Tasarım
            - 🔊 Floating TTS Ses Motoru (Türkçe & İngilizce)
            - ✨ AI Siber Güvenlik Asistanı (Gemini / Groq / OpenRouter)
            - 🇹🇷 Türkçe ve 🇬🇧 İngilizce Çift Dil Arşivi (2.260+ Doküman)
            - 📅 Derleme Tarihi: $(date +'%Y-%m-%d')
          files: HackTricks-Vault-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
