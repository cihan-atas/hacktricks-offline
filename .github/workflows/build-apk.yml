name: Build HackTricks Offline APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  schedule:
    # Her ayın 1'inde ve 15'inde gece 00:00'da otomatik çalışıp yeni güncellemeleri çeker
    - cron: '0 0 1,15 * *'

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Rust & mdBook Tools
        run: |
          mkdir -p bin
          curl -sL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C bin
          cargo install mdbook-tabs --root .
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Fetch and Build HackTricks (EN & TR)
        run: |
          chmod +x ./scripts/fetch_and_build.sh
          ./scripts/fetch_and_build.sh

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          DATE=$(date +'%Y-%m-%d')
          mv android/app/build/outputs/apk/debug/app-debug.apk HackTricks-Offline-${DATE}.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HackTricks-Offline-APK
          path: HackTricks-Offline-*.apk
          retention-days: 30

      - name: Create Release (if manual or scheduled)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: HackTricks Offline Build (${{ github.run_number }})
          body: |
            Güncel HackTricks Türkçe ve İngilizce dokümantasyonu ile derlenmiş APK.
            - Tarih: $(date +'%Y-%m-%d')
            - Otomatik CI/CD derlemesi.
          files: HackTricks-Offline-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
