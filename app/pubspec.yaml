name: hacktricks_vault
description: "HackTricks Cyber Security Knowledge Base - Offline Vault with AI & TTS"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_markdown: ^0.7.7+1
  shared_preferences: ^2.5.3
  markdown: ^7.3.0
  flutter_tts: ^4.2.5
  http: ^1.6.0
  flutter_secure_storage: ^10.3.4
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
    - assets/data/en/
    - assets/data/tr/
